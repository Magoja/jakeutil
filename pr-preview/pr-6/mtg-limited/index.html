<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Sealed Practice</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css"> <!-- Inherit global styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="../" class="floating-back-btn" title="Back to Main">←</a>

  <div class="container">
    <h1>MTG Limited Training</h1>
    <div id="global-loading-overlay" class="loading-overlay" style="display: none;">
      <div class="loading-content">
        <div class="spinner"></div>
        <p>Loading MTG Sets...</p>
      </div>
    </div>

    <fieldset style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 800px;">
      <legend style="padding: 0 10px; font-weight: bold;">Visual Spoiler</legend>
      <div class="subtitle">Select a set or use a shortcut.</div>
      <button id="default-set-btn" class="quick-start-btn" style="display:none;"></button>
      <div class="controls" style="margin-top: 0;">
        <div class="custom-select-wrapper">
          <div class="custom-select">
            <div class="custom-select__trigger"><span>Select a Set</span>
              <div class="arrow"></div>
            </div>
            <div class="custom-select__options">
              <!-- Options will be populated by JS -->
            </div>
          </div>
        </div>
        <button id="play-button" class="action-button">Open</button>
      </div>

      <div id="shortcut-container"
        style="margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <!-- Shortcuts will be populated by JS -->
      </div>
    </fieldset>

    <fieldset style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 800px;">
      <legend style="padding: 0 10px; font-weight: bold;">Open Boosters</legend>
      <div class="subtitle">Select a set to open a booster pack.</div>
      <div class="controls" style="margin-top: 0;">
        <div class="custom-select-wrapper" id="booster-select-wrapper">
          <div class="custom-select" id="booster-select">
            <div class="custom-select__trigger"><span>Select a Set</span>
              <div class="arrow"></div>
            </div>
            <div class="custom-select__options">
              <!-- Options will be populated by JS -->
            </div>
          </div>
        </div>
        <button id="booster-open-button" class="action-button">Open</button>
      </div>
      <div style="margin-top: 20px; text-align: center;">
        <button id="sealed-open-button" class="action-button"
          style="width: 100%; font-size: 1.2em; padding: 15px; background-color: #967adc;">Practice Sealed
          Event</button>
      </div>
      <div id="update-log" style="margin-top: 20px; text-align: left;">
        <ul id="update-log-list" style="margin: 8px 0 0 0; padding-left: 20px; font-size: 0.9em;">
          <li>Loading…</li>
        </ul>
      </div>
    </fieldset>
  </div>

  <script src="js/scryfall.js"></script>
  <script src="js/loading-overlay.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/set-utils.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Show the last 5 entries from keyword.json's update_log below the Practice Sealed button.
    document.addEventListener('DOMContentLoaded', async () => {
      const list = document.getElementById('update-log-list');
      if (!list) return;
      try {
        const res = await fetch('keyword.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const log = Array.isArray(data.update_log) ? data.update_log : [];
        const last5 = log.slice(-5).reverse();
        list.innerHTML = '';
        if (last5.length === 0) {
          const li = document.createElement('li');
          li.textContent = 'No updates yet.';
          list.appendChild(li);
          return;
        }
        for (const entry of last5) {
          const li = document.createElement('li');
          li.textContent = (entry.date || '') + ' — ';
          const b = document.createElement('strong');
          b.textContent = entry.set || '';
          li.appendChild(b);
          li.appendChild(document.createTextNode(': ' + (entry.message || '')));
          list.appendChild(li);
        }
      } catch (err) {
        console.warn('Could not load update log:', err);
        list.innerHTML = '';
        const li = document.createElement('li');
        li.textContent = 'Update history unavailable.';
        list.appendChild(li);
      }
    });
  </script>
</body>
<footer class="sticky-footer">

</html>
