<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Quiz — UI Test</title>
<link rel="stylesheet" href="style.css">
<style>
  .case { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:12px;
          box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .case h3 { margin:0 0 2px; font-size:18px; }
  .case .meta { color:#666; font-size:13px; margin-bottom:8px; font-family:ui-monospace, Menlo, monospace; }
  .case svg.tdiagram { width:100%; max-width:340px; height:auto; display:block; }
  .case .tnotes { margin-top:8px; font-size:14px; color:#555; }
  .case .tformula { margin-top:8px; font-size:14px; color:#333; font-weight:600; }
  .case .tfstrip { margin-top:6px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:17px; }
  .case .tfcell { display:inline-block; min-width:1.15em; padding:0 .1em; text-align:center; border-radius:4px; }
  .case .tfcell.on { background:#2d2d2d; color:#fff; font-weight:bold; }
  .case .tfcell.informula { background:#f2c14e; color:#222; }
  .case .tfcell.off { color:#999; }
  .case .tflegend { margin-top:4px; font-size:12px; color:#666; font-weight:normal; }
  .trow { display:flex; gap:8px; margin-bottom:10px; }
  .trow input { flex:1; min-width:0; font-size:16px; padding:10px 12px;
                border:2px solid #ddd; border-radius:10px; }
  .trow input:focus { outline:none; border-color:#4a90d9; }
  #t-render { width:100%; }
  .err { color:#a00; font-size:14px; }
  h2 { font-size:19px; margin:20px 0 8px; }
</style>
</head>
<body>
<div class="app">
  <a class="home" href="./">← quiz</a>
  <h1>UI Test</h1>
  <p class="sub">Component showcase — diagram, notes, formula, strip. No quiz flow.</p>

  <h2>Bug report</h2>
  <div id="bug-case"></div>

  <h2>Tricky spellings</h2>
  <div id="cases"></div>

  <h2>Try your own</h2>
  <div class="trow">
    <input id="t-chord" value="E7#9" placeholder="Chord (e.g. E7#9)" autocapitalize="off" spellcheck="false">
    <input id="t-voicing" value="0-x-0-1-0-3" placeholder="Voicing (e.g. 0-x-0-1-0-3)" autocapitalize="off" spellcheck="false">
  </div>
  <div class="btn-row"><button class="primary" id="t-render">Render</button></div>
  <div id="t-output"></div>
</div>
<script src="chord-parser.js"></script>
<script src="quiz.js"></script>
<script>
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // formulaHtml() emits .formula/.fstrip/.fcell/.flegend (scoped to .feedback
  // in style.css); re-scope those classes to our .case styles.
  function rescopedFormulaHtml(chord, voicing) {
    return ChordQuiz.formulaHtml(chord, voicing)
      .replace(/class="formula"/g, 'class="tformula"')
      .replace(/class="fstrip"/g, 'class="tfstrip"')
      .replace(/class="fcell/g, 'class="tfcell')
      .replace(/class="flegend"/g, 'class="tflegend"');
  }

  function renderCase(container, chord, voicing, note) {
    var div = document.createElement('div');
    div.className = 'case';
    var parsed = null;
    try { parsed = ChordParser.parse(chord); } catch (e) {}
    var notesHtml;
    if (!parsed) {
      notesHtml = '<div class="err">Could not parse chord name "' + esc(chord) + '"</div>';
    } else {
      notesHtml = '<div class="tnotes">Notes: ' + esc(ChordQuiz.voicingNotes(voicing)) + '</div>' +
        rescopedFormulaHtml(chord, voicing);
    }
    div.innerHTML = '<h3>' + esc(chord) + '</h3>' +
      '<div class="meta">' + esc(voicing) + (note ? ' &nbsp;·&nbsp; ' + esc(note) : '') + '</div>' +
      '<svg class="tdiagram" role="img"></svg>' + notesHtml;
    container.appendChild(div);
    if (parsed) ChordQuiz.renderDiagram(div.querySelector('svg'), voicing, false);
    return div;
  }

  var bugCases = [
    ['Bm7', 'x-2-0-2-3-2', 'reported bug — F# must be labeled dark, not blank'],
  ];
  var tricky = [
    ['E7#9',   '0-x-0-1-0-3', '#9 spelled F##'],
    ['Cdim7',  'x-3-4-2-4-x', 'bb7 spelled Bbb'],
    ['Bbmaj9', 'x-1-0-2-1-1', 'flat key — Bb, Db region'],
    ['G13',    '3-x-2-2-0-1', '13 vs 6'],
    ['Fmaj7#11', '1-3-3-2-0-0', '#11'],
    ['Cmaj9',  'x-3-5-4-3-0', 'baseline'],
  ];

  var bugBox = document.getElementById('bug-case');
  bugCases.forEach(function (c) { renderCase(bugBox, c[0], c[1], c[2]); });
  var caseBox = document.getElementById('cases');
  tricky.forEach(function (c) { renderCase(caseBox, c[0], c[1], c[2]); });

  var out = document.getElementById('t-output');
  document.getElementById('t-render').onclick = function () {
    out.innerHTML = '';
    renderCase(out,
      document.getElementById('t-chord').value.trim(),
      document.getElementById('t-voicing').value.trim(), '');
  };
  // render the default values on load
  document.getElementById('t-render').onclick();
})();
</script>
</body>
</html>
